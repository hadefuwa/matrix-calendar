<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Calendar</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Simple calendar app for meeting rooms">
    <meta name="theme-color" content="#0078d4">
    <link rel="manifest" href="manifest.json">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <img src="assets/matrix-logo.png" alt="Matrix Calendar" class="logo">
        </header>

        <!-- Calendar Grid -->
        <main class="calendar-grid">
            <!-- Meeting Room -->
            <div class="calendar-card">
                <div class="card-header">
                    <h2>🏢 Upstairs Meeting Room</h2>
                </div>
                <div class="calendar-content" id="meeting-calendar">
                    <iframe 
                        src="https://outlook.office365.com/calendar/published/15cc259caae04195a39ab6a54589ecfc@matrixtsl.com/d1fea91d2c25417683c06ebb8c46a0c35946753543420400180/calendar.html"
                        title="Upstairs Meeting Room Calendar">
                    </iframe>
                </div>
            </div>

            <!-- Training Room -->
            <div class="calendar-card">
                <div class="card-header">
                    <h2>🎓 Training Room</h2>
                </div>
                <div class="calendar-content" id="training-calendar">
                    <iframe 
                        src="https://outlook.office365.com/calendar/published/6f53b7c0d0ac41da935c73c3cae1490d@matrixtsl.com/a80346249c114ac5a53c4a8f94934dcc10775208480448111447/calendar.html"
                        title="Training Room Calendar">
                    </iframe>
                </div>
            </div>
        </main>

    </div>

    <!-- JavaScript -->
    <script src="app.js"></script>
</body>
</html>
